<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="630" viewBox="0 0 1100 630" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker></defs>
<rect width="1100" height="630" fill="#ffffff"/>
<rect x="30" y="40" width="210" height="100" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/>
<text x="135.0" y="65.0" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2328">Agent (local model)</text>
<text x="135.0" y="85.0" text-anchor="middle" font-size="13" fill="#59636e">reads records</text>
<text x="135.0" y="105.0" text-anchor="middle" font-size="13" fill="#59636e">proposes one action</text>
<text x="135.0" y="125.0" text-anchor="middle" font-size="13" fill="#59636e">has no write tools</text>
<rect x="300" y="40" width="230" height="100" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/>
<text x="415.0" y="65.0" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2328">act</text>
<text x="415.0" y="85.0" text-anchor="middle" font-size="13" fill="#59636e">runs the reads</text>
<text x="415.0" y="105.0" text-anchor="middle" font-size="13" fill="#59636e">saves the decision snapshot</text>
<text x="415.0" y="125.0" text-anchor="middle" font-size="13" fill="#59636e">refuses unread targets</text>
<rect x="590" y="40" width="220" height="100" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="1.6"/>
<text x="700.0" y="65.0" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2328">approve</text>
<text x="700.0" y="85.0" text-anchor="middle" font-size="13" fill="#59636e">conditions from snapshot</text>
<text x="700.0" y="105.0" text-anchor="middle" font-size="13" fill="#59636e">mints idempotency key</text>
<text x="700.0" y="125.0" text-anchor="middle" font-size="13" fill="#59636e">logs: approval</text>
<rect x="870" y="40" width="200" height="100" rx="10" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.6"/>
<text x="970.0" y="75.0" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2328">pause</text>
<text x="970.0" y="95.0" text-anchor="middle" font-size="13" fill="#59636e">human approval point</text>
<text x="970.0" y="115.0" text-anchor="middle" font-size="13" fill="#59636e">the world may change</text>
<line x1="240" y1="75" x2="300" y2="75" stroke="#8c959f" stroke-width="1.6" marker-end="url(#a)"/>
<text x="270.0" y="67.0" text-anchor="middle" font-size="12.5" fill="#59636e">tool calls</text>
<line x1="300" y1="108" x2="240" y2="108" stroke="#8c959f" stroke-width="1.6" marker-end="url(#a)"/>
<text x="270.0" y="126.0" text-anchor="middle" font-size="12.5" fill="#59636e">results</text>
<line x1="530" y1="90" x2="590" y2="90" stroke="#8c959f" stroke-width="1.6" marker-end="url(#a)"/>
<text x="560.0" y="82.0" text-anchor="middle" font-size="12.5" fill="#59636e">proposal</text>
<line x1="810" y1="90" x2="870" y2="90" stroke="#8c959f" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="870" y="230" width="200" height="100" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="1.6"/>
<text x="970.0" y="255.0" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2328">recheck</text>
<text x="970.0" y="275.0" text-anchor="middle" font-size="13" fill="#59636e">reads the record again</text>
<text x="970.0" y="295.0" text-anchor="middle" font-size="13" fill="#59636e">checks every condition</text>
<text x="970.0" y="315.0" text-anchor="middle" font-size="13" fill="#59636e">logs: recheck</text>
<line x1="970" y1="140" x2="970" y2="230" stroke="#8c959f" stroke-width="1.6" marker-end="url(#a)"/>
<text x="1000.0" y="189.0" text-anchor="middle" font-size="12.5" fill="#59636e">resume</text>
<polygon points="630,280 710,230 790,280 710,330" fill="#ffffff" stroke="#8c959f" stroke-width="1.6"/>
<text x="710" y="277" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">a fact moved</text>
<text x="710" y="295" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">past its limit?</text>
<line x1="870" y1="280" x2="790" y2="280" stroke="#8c959f" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="300" y="230" width="260" height="100" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="1.6"/>
<text x="430.0" y="255.0" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2328">effect</text>
<text x="430.0" y="275.0" text-anchor="middle" font-size="13" fill="#59636e">writes only if conditions still hold</text>
<text x="430.0" y="295.0" text-anchor="middle" font-size="13" fill="#59636e">stores the key (UNIQUE)</text>
<text x="430.0" y="315.0" text-anchor="middle" font-size="13" fill="#59636e">in the same transaction</text>
<line x1="630" y1="280" x2="560" y2="280" stroke="#8c959f" stroke-width="1.6" marker-end="url(#a)"/>
<text x="595.0" y="272.0" text-anchor="middle" font-size="12.5" fill="#59636e">no</text>
<line x1="710" y1="330" x2="710" y2="400" stroke="#8c959f" stroke-width="1.6" marker-end="url(#a)"/>
<text x="728.0" y="369.0" text-anchor="middle" font-size="12.5" fill="#59636e">yes</text>
<rect x="30" y="400" width="160" height="64" rx="32" fill="#ecfdf3" stroke="#16a34a" stroke-width="1.6"/>
<text x="110.0" y="427.0" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2328">allowed</text>
<text x="110.0" y="447.0" text-anchor="middle" font-size="13" fill="#59636e">logs: allow</text>
<rect x="205" y="400" width="200" height="64" rx="32" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="305.0" y="427.0" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2328">duplicate suppressed</text>
<text x="305.0" y="447.0" text-anchor="middle" font-size="13" fill="#59636e">key already used</text>
<rect x="420" y="400" width="185" height="64" rx="32" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="512.5" y="427.0" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2328">blocked at write</text>
<text x="512.5" y="447.0" text-anchor="middle" font-size="13" fill="#59636e">changed after recheck</text>
<rect x="630" y="400" width="160" height="64" rx="32" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="710.0" y="427.0" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2328">blocked</text>
<text x="710.0" y="447.0" text-anchor="middle" font-size="13" fill="#59636e">logs: block + field</text>
<line x1="360" y1="330" x2="110" y2="400" stroke="#8c959f" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="430" y1="330" x2="305" y2="400" stroke="#8c959f" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="500" y1="330" x2="512" y2="400" stroke="#8c959f" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="30" y="530" width="1040" height="70" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
<text x="550" y="559" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2328">Ledger: append-only, hash-chained SQLite log</text>
<text x="550" y="581" text-anchor="middle" font-size="13" fill="#59636e">events: approval · recheck · allow · block · duplicate_suppressed   |   each entry stores the previous entry's hash; UPDATE and DELETE are refused</text>
<line x1="110" y1="464" x2="110" y2="530" stroke="#7c3aed" stroke-width="1.4" stroke-dasharray="4 4"/>
<line x1="305" y1="464" x2="305" y2="530" stroke="#7c3aed" stroke-width="1.4" stroke-dasharray="4 4"/>
<line x1="512" y1="464" x2="512" y2="530" stroke="#7c3aed" stroke-width="1.4" stroke-dasharray="4 4"/>
<line x1="710" y1="464" x2="710" y2="530" stroke="#7c3aed" stroke-width="1.4" stroke-dasharray="4 4"/></svg>
