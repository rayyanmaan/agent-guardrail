<text x="550" y="562" text-anchor="middle" font-size="13" fill="#59636e">The idempotency_key recorded in the ledger's approval entry is the same key stored with the effect (applied_changes or outbox).</text>
<text x="550" y="582" text-anchor="middle" font-size="13" fill="#59636e">A UNIQUE key means the same approved action can only take effect once. Each scenario run gets its own set of files.</text></svg>
