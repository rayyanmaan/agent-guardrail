<rect x="30" y="294" width="330" height="96" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/>
<text x="45" y="316" font-size="13" fill="#1f2328">Events: approval, recheck, allow, block,</text>
<text x="45" y="335" font-size="13" fill="#1f2328">duplicate_suppressed. Triggers abort any</text>
<text x="45" y="354" font-size="13" fill="#1f2328">UPDATE or DELETE; verify_chain() recomputes</text>
<text x="45" y="373" font-size="13" fill="#1f2328">every hash to detect tampering.</text>
